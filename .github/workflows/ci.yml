name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m cmdb_health.cli --cis data/sample_cmdb_ci.csv --rels data/sample_cmdb_rel_ci.csv --as-of 2026-11-20
